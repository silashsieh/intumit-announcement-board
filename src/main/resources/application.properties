spring.application.name=announcement-board

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema creation. Hibernate only validates the mapped entity.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SQL logging is off by default. Enable with JPA_SHOW_SQL=true (and optionally JPA_FORMAT_SQL=true).
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
