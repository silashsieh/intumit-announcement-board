services:
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-announcement_board}"
      MYSQL_USER: "${MYSQL_USER:-announcement_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-announcement_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password}"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
